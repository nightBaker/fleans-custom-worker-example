name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/Fleans.CustomWorkerHost
      - run: dotnet build src/Fleans.CustomWorkerHost --no-restore --configuration Release

      # A worker takes no dependency on Orleans or on engine internals, directly or transitively.
      - name: Verify the dependency closure
        run: |
          set -euo pipefail
          deps=$(dotnet list src/Fleans.CustomWorkerHost package --include-transitive)
          if echo "$deps" | grep -iE '> (Microsoft\.Orleans|Fleans\.(Application|Domain|Infrastructure|Persistence|Worker))'; then
            echo "::error::Orleans or an engine package leaked into the dependency closure"
            exit 1
          fi
          echo "OK: Fleans.ExternalTasks.Sdk only"
